name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew :core:testDebugUnitTest :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dumbtalk-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.DUMBTALK_KEYSTORE_BASE64 }}
          DUMBTALK_KEYSTORE_PASSWORD: ${{ secrets.DUMBTALK_KEYSTORE_PASSWORD }}
          DUMBTALK_KEY_ALIAS: ${{ secrets.DUMBTALK_KEY_ALIAS }}
          DUMBTALK_KEY_PASSWORD: ${{ secrets.DUMBTALK_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Release signing secrets are not configured"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          DUMBTALK_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "dumbtalk-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dumbtalk-${GITHUB_REF_NAME}.apk" --generate-notes
