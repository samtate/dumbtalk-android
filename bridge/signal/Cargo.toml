[package]
name = "sigbridge"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
base64 = "0.22"
# Pinned to a commit at least two weeks old; bump deliberately.
presage = { git = "https://github.com/whisperfish/presage", rev = "33dd1491130793390e356e15a5711f1e6ca14fdb", features = ["cdsi"] }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "33dd1491130793390e356e15a5711f1e6ca14fdb", default-features = false }
# Plain bundled SQLite instead of SQLCipher: the data already lives in Android's
# encrypted app storage, and whisperfish's SQLCipher fork doesn't build for ARM.
libsqlite3-sys = { version = "0.36", features = ["bundled"] }

uniffi = { version = "0.29", features = ["cli"] }
tokio = { version = "1.48", features = ["rt", "sync", "time", "macros"] }
futures = "0.3"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
url = "2"
tracing = "0.1"
thiserror = "2"
# The same versions libsignal-service uses: group changes go to Signal's
# group server directly, which presage doesn't do.
rand = "0.9"
reqwest = { version = "0.13", default-features = false }

# Signal's networking verifies TLS with Android's trust store via JNI, which
# needs initialising from Kotlin (SignalNative.init).
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false }
rustls-platform-verifier = "0.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Keep symbols: UniFFI reads its metadata from them.
strip = "debuginfo"
panic = "unwind"
